# Rebuild data/nodes.json weekly from DE's export + the wiki (see build_nodes.py).
# Commits only when the data changed; git history is the version log.
# Opens an issue when a change moves anyone's mastery total.
name: Build node data

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: build-nodes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Exits 2 without writing anything if a source can't be fetched or parsed,
      # which fails the job (GitHub emails you) and leaves the live file alone.
      - name: Build data/nodes.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python build_nodes.py
          --report "$RUNNER_TEMP/alerts.md"
          --commit-message "$RUNNER_TEMP/message.txt"

      - name: Commit changes
        run: |
          if git diff --quiet -- data/nodes.json; then
            echo "Node data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nodes.json
          git commit -F "$RUNNER_TEMP/message.txt"
          git push

      - name: Open issue for mastery-affecting changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s "$RUNNER_TEMP/alerts.md" ]; then
            gh issue create \
              --title "Node data: mastery-affecting changes ($(date -u +%F))" \
              --body-file "$RUNNER_TEMP/alerts.md"
          fi
